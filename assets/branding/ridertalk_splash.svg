  <g transform="translate(540 820) scale(0.84) translate(-256 -256)">
    <path d="M 106.0 220.5 C 124.0 170.5, 164.0 136.5, 219.0 134.5 C 269.0 134.5, 316.0 164.5, 342.0 212.5 C 346.0 242.5, 346.0 277.5, 344.0 307.5 C 348.0 320.5, 350.0 330.5, 350.0 338.5 C 344.0 352.5, 334.0 362.5, 322.0 367.5 C 269.0 347.5, 204.0 322.5, 142.0 280.5 C 129.0 267.5, 122.0 257.5, 118.0 248.5 C 122.0 244.5, 128.0 240.5, 126.0 237.5 C 118.0 232.5, 110.0 226.5, 106.0 220.5 Z" fill="#00E676"/>
    <path d="M 142.0 280.5 C 204.0 322.5, 269.0 347.5, 322.0 367.5 C 309.0 374.5, 289.0 377.5, 274.0 374.5 C 214.0 347.5, 164.0 314.5, 122.0 272.5 C 129.0 274.5, 136.0 277.5, 142.0 280.5 Z" fill="#13171E"/>
    <path d="M 106.0 220.5 L 126.0 237.5 L 118.0 248.5 Z" fill="#090B0E"/>
    <path d="M 338.0 214.5 C 302.0 200.5, 262.0 198.5, 236.0 210.5 C 228.0 220.5, 230.0 234.5, 239.0 244.5 C 262.0 270.5, 302.0 294.5, 338.0 306.5 C 340.0 277.5, 340.0 247.5, 338.0 214.5 Z" fill="#090B0E" stroke="#B9F6CA" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 250.0 218.0 Q 285.0 210.0, 325.0 218.0" fill="none" stroke="#B9F6CA" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="144.0" y="300.5" width="46" height="24" rx="6" fill="#13171E" stroke="#B9F6CA" stroke-width="3.5"/>
    <circle cx="158.0" cy="312.5" r="5.5" fill="#FF9100"/>
    <path d="M 166.0 314.5 C 212.0 340.5, 269.0 352.5, 336.0 338.5" fill="none" stroke="#E2E8F0" stroke-width="9.5" stroke-linecap="round"/>
    <circle cx="348.0" cy="336.5" r="9.5" fill="#E2E8F0"/>
    <path d="M 374.0 318.0 A 32 32 0 0 1 374.0 355.0" fill="none" stroke="#B9F6CA" stroke-width="11.5" stroke-linecap="round"/>
    <path d="M 394.0 304.0 A 56 56 0 0 1 394.0 369.0" fill="none" stroke="#00E676" stroke-width="11.5" stroke-linecap="round"/>
  </g>


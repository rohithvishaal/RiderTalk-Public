<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">RiderTalk Splash Screen</title>
  <desc id="desc">Tarmac Stealth obsidian RiderTalk splash screen with glowing helmet icon tile and wordmark.</desc>

  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#00E676" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#090B0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="splashTileBg" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#1E2633"/>
      <stop offset="52%" stop-color="#10141B"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>
  </defs>

  <!-- Obsidian Canvas + Ambient Radial Glow -->
  <rect width="1080" height="1920" fill="#090B0E"/>
  <rect width="1080" height="1920" fill="url(#ambientGlow)"/>

  <!-- Centered Icon Tile -->
  <rect x="370" y="650" width="340" height="340" rx="88" fill="url(#splashTileBg)" stroke="#00E676" stroke-opacity="0.42" stroke-width="4"/>


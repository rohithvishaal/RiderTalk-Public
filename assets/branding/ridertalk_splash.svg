  <rect x="330" y="1148" width="420" height="56" rx="28" fill="#00E676" fill-opacity="0.10" stroke="#00E676" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="378" cy="1176" r="8" fill="#00E676"/>
  <text x="556" y="1186" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="5">OFFLINE WI-FI INTERCOM</text>
